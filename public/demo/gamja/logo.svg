<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Circular White Seal Background matching @gamja_sg Instagram Icon -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#DAC5A7" stroke-width="2" />
  
  <!-- Subtle Inner Hairline Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#DAC5A7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Bold Handcrafted Hangul: 감자 in Deep Oxblood Red (#3A100B) -->
  <g fill="#3A100B" text-anchor="middle">
    <!-- Hangul Glyphs -->
    <text 
      x="100" 
      y="108" 
      font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Plus Jakarta Sans', sans-serif" 
      font-weight="900" 
      font-size="46" 
      letter-spacing="2"
    >감자</text>
    
    <!-- Latin Brand Mark -->
    <text 
      x="100" 
      y="136" 
      font-family="'Geist', 'Plus Jakarta Sans', sans-serif" 
      font-weight="700" 
      font-size="12" 
      letter-spacing="6"
      opacity="0.9"
    >GAMJA</text>

    <!-- Micro Subline -->
    <text 
      x="100" 
      y="152" 
      font-family="'Geist', sans-serif" 
      font-weight="500" 
      font-size="7" 
      letter-spacing="3.5"
      fill="#C23B22"
    >TELOK AYER</text>
  </g>
</svg>