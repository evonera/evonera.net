<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#191919"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid3)"/>
  <circle cx="600" cy="315" r="280" fill="url(#glow3)" filter="blur(60px)"/>
  
  <rect x="60" y="60" width="1080" height="510" rx="16" stroke="#333333" stroke-width="1.5" fill="#1e1e1e" fill-opacity="0.6"/>
  
  <rect x="100" y="100" width="180" height="32" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4"/>
  <text x="114" y="121" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">DEVELOPER TOOLING</text>
  
  <text x="100" y="220" fill="#FFFFFF" font-family="sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Essential Developer Tools in 2026</text>
  <text x="100" y="270" fill="#9CA3AF" font-family="sans-serif" font-size="22" font-weight="400">Repomix, DeepWiki, CodeWiki &amp; LLM Context Orchestration</text>
  
  <!-- Tool Badges -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#141414" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="20" y="35" fill="#FBBF24" font-family="monospace" font-size="14" font-weight="bold">📦 Repomix</text>
    <text x="20" y="65" fill="#9CA3AF" font-family="sans-serif" font-size="11">Pack entire repos into token-optimized LLM context</text>
    
    <rect x="250" y="0" width="220" height="120" rx="8" fill="#141414" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="270" y="35" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="bold">🧠 DeepWiki</text>
    <text x="270" y="65" fill="#9CA3AF" font-family="sans-serif" font-size="11">Autonomous deep-dive repo documentation generation</text>
    
    <rect x="500" y="0" width="220" height="120" rx="8" fill="#141414" stroke="#10B981" stroke-width="1.5"/>
    <text x="520" y="35" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold">⚡ CodeWiki</text>
    <text x="520" y="65" fill="#9CA3AF" font-family="sans-serif" font-size="11">Interactive architectural graph &amp; dependency trees</text>
  </g>
  
  <text x="100" y="520" fill="#6B7280" font-family="monospace" font-size="13">Evonera Tooling Stack · Modern AI Engineer Toolkit</text>
</svg>
